<script src="/js/page-transition.js"></script>
<script>
    // Clean up .open class on resize to prevent nav flash
    var header = document.querySelector('.header');
    var navToggle = document.getElementById('nav-toggle');
    if (header && navToggle) {
        var prevWidth = window.innerWidth;
        window.addEventListener('resize', function() {
            if (window.innerWidth !== prevWidth) {
                header.classList.remove('open', 'fade');
                if (navToggle.checked) navToggle.checked = false;
                prevWidth = window.innerWidth;
            }
        });
    }
</script>
<script>
    // Fix all #hash links broken by <base href="/">
    // Rewrite href so the browser status bar shows the correct URL
    document.querySelectorAll('a[href^="#"]').forEach(function(a) {
        a.href = location.pathname + a.getAttribute('href');
    });

    document.addEventListener('click', function(e) {
        var link = e.target.closest('a');
        if (!link) return;
        var raw = link.getAttribute('href');
        if (!raw || raw.indexOf('#') === -1) return;
        var id = raw.split('#').pop();
        if (!id) return;
        e.preventDefault();
        var target = document.getElementById(id);
        if (target) {
            target.scrollIntoView({ behavior: 'smooth' });
        } else {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    });
</script>
<script>
    // Override theme switcher: light ↔ dark only, no system.
    // Icon visibility is handled by CSS ([data-theme] selectors),
    // so JS only needs to toggle the attribute.
    if (localStorage.getItem('theme') === 'system') {
        localStorage.setItem('theme', document.documentElement.getAttribute('data-theme') || 'light');
    }

    document.addEventListener('click', function(e) {
        if (!e.target.closest('#theme-switcher')) return;
        e.preventDefault();
        e.stopImmediatePropagation();

        var cur = document.documentElement.getAttribute('data-theme') || 'light';
        var next = cur === 'dark' ? 'light' : 'dark';

        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);

        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', next === 'dark' ? '{{ .Site.Params.themeColorDark }}' : '{{ .Site.Params.themeColor }}');
    }, true);
</script>
<script>
    // Fix load-comments button: after page transition the theme's
    // DOMContentLoaded handler is lost. Use event delegation.
    document.addEventListener('click', function(e) {
        if (!e.target.closest('#load-comments')) return;
        if (typeof loadComments !== 'function') return;
        loadComments();
        var btn = document.getElementById('load-comments');
        if (btn) btn.style.display = 'none';
    });
</script>
<script>
    // Add a class to the body if the user agent is Safari
    if (navigator.userAgent.includes('Safari') && !navigator.userAgent.includes('Chrome')) {
        document.body.classList.add('safari-only');
    }
</script>
