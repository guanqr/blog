<!DOCTYPE html>
<html lang="{{ .Site.Language.Locale }}"{{ if and .Site.Params.enableDarkMode .Site.Params.overrideSystemPreferences }}{{ with .Site.Params.defaultTheme | default "light" }} data-theme="{{ . }}"{{ end }}{{ end }}>
    {{ partial "head.html" . }}
    <body>
        <div class="container">
            {{ partial "header.html" . }}
            {{ block "main" . }}{{ end }}
            {{ partial "footer.html" . }}
        </div>
    </body>
</html>
