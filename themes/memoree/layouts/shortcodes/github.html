<div class="github">
    <div class="logo">
        {{ partial "utils/icon.html" (dict "name" "repository" "class" "github-icon") }}
        <a class="name" href={{ .Get "link" }} target="_blank" rel="noopener noreferrer">{{ .Get "name" }}</a>
    </div>
    <div class="description">{{ .Get "description" }}</div> 
    <div class="language">
        <span class="language-color" style="background-color: {{ .Get "color" }}"></span>
        <span class="language-name">{{ .Get "language" }}</span>
    </div>
</div>
