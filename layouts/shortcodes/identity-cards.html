<div class="identity-cards">
    {{ range site.Data.identities.items }}
        <div class="identity-card">
            <div class="identity-card-emoji">{{ .emoji }}</div>
            <div class="identity-card-title">{{ .title }}</div>
            <div class="identity-card-desc"><p>{{ .description }}</p></div>
        </div>
    {{ end }}
</div>
