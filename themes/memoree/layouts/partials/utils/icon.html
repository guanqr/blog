{{/*
  按名称从 data/SVG.toml 取内联 SVG 图标，并把 svg 上的 class="icon" 替换为 class="icon <class>"
  参数：name（图标名）、class（追加类名，默认与 name 相同）
  返回：safeHTML 的 <svg>
  注意：本 partial 是底层实现，调用点请用 utils/icon-cached.html——
        该包装单点维护 partialCached 与显式 variant（dict 输入依赖默认
        缓存键会跨图标串键，2026-10-17 实测）
  Usage:
    {{ partial "utils/icon-cached.html" (dict "name" "archive" "class" "archives") }}
*/}}
{{- $name := .name -}}
{{- $class := .class | default $name -}}
{{- $icon := index hugo.Data.SVG $name -}}
{{- $class := printf "icon %s" $class -}}
{{- return (replace $icon "icon" $class | safeHTML) -}}
