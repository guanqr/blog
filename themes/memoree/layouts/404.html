<!DOCTYPE html>
<html lang="{{ .Site.Language.Locale }}">
    {{ partial "head.html" . }}
    <body>
        <div class="container">
            <main class="fof">
                <div class="fof-inner">
                    <div class="fof-code">404</div>
                    <h1 class="fof-title">{{ i18n "pageNotFound" }}</h1>
                    <p class="fof-desc">{{ i18n "pageNotFoundDesc" }}</p>
                    <!-- 根相对地址按主机解析、与请求路径深度无关（relativeURLs = false），
                         本地预览与线上部署均指向当前站点的首页 -->
                    <a class="fof-home" href="{{ "" | relLangURL }}">{{ i18n "fofLinkText" }}</a>
                </div>
            </main>
        </div>
    </body>
</html>
