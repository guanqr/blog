##########################################
# 站点配置

baseURL = "https://guanqr.com/"
title = "荷戟獨彷徨"
locale = "zh-hant"
hasCJKLanguage = true
# 版权信息（支持 Markdown）
copyright = "本文採用 [CC BY-NC-SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0/deed.zh) 許可協議，轉載請註明出處。"

# 主题选择
theme = "meme"

# `hugo new` 新建文章自动打开的文本编辑器
newContentEditor = ""

# i18n
defaultContentLanguage = "zh-hant"
defaultContentLanguageInSubdir = false

# 标题大小写格式
# https://gohugo.io/getting-started/configuration/#configure-title-case
titleCaseStyle = "none"

# 是否复数化列表页面的标题
pluralizeListTitles = false

# 摘要的字数限制
summaryLength = 150

# 是否开启 GitHub 风格的 Emoji 书写方式
enableEmoji = false

# 脚注的返回链接中的文本
footnoteReturnLinkContents = "↩"

# 是否启用 Git 版本信息
enableGitInfo = true

# 是否生成 robots.txt 文件
enableRobotsTXT = false

# URL 相关
disablePathToLower = false
relativeURLs = true
uglyURLs = false

# URL 结构
[permalinks]
    #categories = "/categories/:slug/"
    tags = "/tags/:slug/"
    series = "/series/:slug/"

# 类别
[taxonomies]
    #category = "categories"
    tag = "tags"
    series = "series"

# 修改时间
[frontmatter]
    lastmod = ["lastmod", ":git", ":fileModTime", ":default"]

[pagination]
    disableAliases = false
    # 每一分页的文章数（仅对「文章摘要」首页布局有效）
    pagerSize = 5
    path = 'page'

# Markdown 渲染器
[markup]
    defaultMarkdownHandler = "goldmark"
    [markup.goldmark]
        [markup.goldmark.extensions]
            definitionList = true
            footnote = true
	        linkify = true
            strikethrough = true
            table = true
            taskList = true
            typographer = false
        [markup.goldmark.parser]
            attribute = true
            autoHeadingID = true
            autoHeadingIDType = "github"
        [markup.goldmark.renderer]
            hardWraps = false
            unsafe = true
            xHTML = false
    [markup.highlight]
        codeFences = true
        guessSyntax = false
        noClasses = false
        lineNos = true
        lineNumbersInTable = true
    [markup.tableOfContents]
        startLevel = 2
        endLevel = 6
        ordered = true

# 压缩 HTML
[minify.tdewolff.html]
    keepWhitespace = false

# 相关文章
[related]
    threshold = 80
    includeNewer = true
    toLower = true
	[[related.indices]]
        name = "series"
        weight = 100
    #[[related.indices]]
    #    name = "categories"
    #    weight = 100
    [[related.indices]]
        name = "tags"
        weight = 95
    [[related.indices]]
        name = "date"
        weight = 80
        pattern = "2006"

# Atom 文件格式的媒体类型
[mediaTypes."application/atom+xml"]
    suffixes = ["xml"]

# MemE 主题自定义的 Atom 模板
[outputFormats.SectionsAtom]
    mediaType = "application/atom+xml"
    baseName = "atom"

# MemE 主题自定义的 RSS 模板
[outputFormats.SectionsRSS]
    mediaType = "application/rss+xml"
    baseName = "rss"

# lunr.js 的搜索索引
[outputFormats.SearchIndex]
    mediaType = "application/json"
    baseName = "search"

# Algolia 的搜索索引
#[outputFormats.Algolia]
    #mediaType = "application/json"
    #baseName = "algolia"
    #isPlainText = true
    #notAlternative = true

# Hugo 的输出控制
[outputs]
    page = ["HTML"]
    # home = ["HTML", "SectionsAtom", "SectionsRSS", "SearchIndex", "Algolia"]
    home = ["HTML", "SectionsAtom", "SectionsRSS"]
    section = ["HTML"]
    taxonomy = ["HTML"]
    term = ["HTML"]

# RSS & Atom 文章数限制
[services.rss]
    limit = -1


