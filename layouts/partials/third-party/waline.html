<link rel="stylesheet" href="https://unpkg.com/@waline/client@v3/dist/waline.css">
<script>
    function loadComments() {
        if (!document.getElementById('waline')) {
            return;
        }
        if (typeof init === 'undefined') {
            const getScript = (options) => {
                const script = document.createElement('script');
                script.defer = true;
                script.crossOrigin = 'anonymous';
                Object.keys(options).forEach((key) => {
                    script[key] = options[key];
                });
                document.body.appendChild(script);
            };
            getScript({
                src: 'https://unpkg.com/@waline/client@v3/dist/waline.js',
                onload: () => {
                    newWaline();
                }
            });
        } else {
            newWaline();
        }
    }
    function newWaline() {
        const locale = {
            nick: "昵称*",
            mail: "邮箱*",
            placeholder: "请填写正确的昵称和邮箱，方便接收评论回复信息。若随意填写邮箱地址，发布包括但不限于广告、攻击性、无意义等内容文字，将会视该评论为垃圾评论，作删除处理。"
        };
        init({
            el: '#waline',
            serverURL: '{{ .Site.Params.walineServerURL }}',
            lang: '{{ .Site.Params.walineLang }}',
            locale,
            emoji: {{ .Site.Params.walineEmoji }},
            dark: 'html[data-theme="dark"]',
            commentSorting: '{{ .Site.Params.walineCommentSorting }}',
            meta: {{ .Site.Params.walineMeta }},
            requiredMeta: {{ .Site.Params.walineRequiredMeta }},
            login: '{{ .Site.Params.walineLogin }}',
            wordLimit: {{ .Site.Params.walineWordLimit }},          
            pageSize: {{ .Site.Params.walinePageSize }},
            imageUploader: {{ .Site.Params.walineImageUploader }},
            highlighter: {{ .Site.Params.walineHighlighter }},
            search: {{ .Site.Params.walineSearch }},
            noCopyright: {{ .Site.Params.walineNoCopyright }}            
        });
    }
</script>
