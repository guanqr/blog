[[items]]
emoji = "🎓"
title = "ZJUer"
description = "浙江大學 2021 屆畢業生。住過紫金港碧峰 3 舍和玉泉 7 舍，爬過北高峰，在大雨中測過十二分鐘跑，在華家池的定向越野中迷過路。在校期間經常在晚上到西湖邊上散步。"

[[items]]
emoji = "🎬"
title = "影視愛好者"
description = "喜歡觀看不論國內外的各種類型的電影和電視劇，特別是懸疑、科幻、超英、克蘇魯題材。極度排斥豆瓣平台，極度排斥以豆瓣評分和豆瓣排名評價電影好壞，極度排斥為了流量狂吹或狂踩一部電影的二極體影評人。"

[[items]]
emoji = "📷"
title = "攝影愛好者"
description = "喜歡帶著相機去記錄世界的美好。目前的設備是尼康 Z8。熱衷於拍攝自然風光。很排斥重度後期，反感為實現完美構圖，在畫面中增減元素和重塑光影的行為。"

[[items]]
emoji = "🦾"
title = "模型玩家"
description = "喜歡拼裝類的玩具，諸如高達、樂高。喜歡收藏影視相關的人偶，不論量產或定制，不論有無官方授權。只要能夠還原人物形象，就是優秀的作品。堅決抵制不良的翻模商家，這群人不斷消耗第三方創作者的熱情。"

[[items]]
emoji = "🃏"
title = "卡牌收集者"
description = "喜歡收藏很多畫師創作的水滸、三國、西遊、封神等不同題材、不同畫風、不同工藝的卡牌。這是一種對童年收藏方便麵裡的卡牌情懷的延續。還有一些畫師親筆繪製的手繪卡。"

[[items]]
emoji = "🦋"
title = "標本收藏家"
description = "喜歡收集各種各樣不含放射性元素的礦石、海貝、陸貝、節肢動物標本。對節肢動物的整姿技術一般。既讓我沉迷又讓我頭疼的環節就是給標本製作分類標籤。"
