##########################################
# 主题配置

[params]
    ######################################
    # 歸檔頁面
    # 歸檔頁生成年份的起點（内容適配器會自動生成
    # /archives/YYYY/ 頁面）
    archiveStartYear = 2019

    ######################################
    # 顶栏

    # 是否开启
    enableHeader = true

    # 是否自动隐藏
    enableHeaderAutoHide = false
    # 说明：仅对弹性布局的顶栏有效

    # 是否在首页显示
    displayHeaderInHome = true
    # 说明：对弹性布局的顶栏无效

    # 背景
    headerBackground = "alpha(var(--color-bg), 0.8) linear-gradient(90deg, #f795331a 0, #f370551a 15%, #ef4e7b1a 30%, #a166ab1a 44%, #5073b81a 58%, #1098ad1a 72%, #07b39b1a 86%, #6dba821a 100%)"
    # 说明：https://developer.mozilla.org/zh-CN/docs/Web/CSS/background

    # 顶栏布局
    headerLayout = "flex"
    # 说明：居中布局（center）或弹性布局（flex）

    # 在窄视图下隐藏菜单栏并显示一个按钮？
    enableNavToggle = true

    navHeight = "9em"
    # 说明：菜单栏展开时的高度


    ######################################
    # 品牌栏（在顶栏内）

    # 是否使用 SVG 图片
    siteBrandSVG = false
    # 如果是，请将你的 SVG 放到 `SVG.toml` 文
    # 件内，并配置以下项。单位：px。
    siteBrandSVGWidth = 30
    siteBrandSVGHeight = 30
    siteBrandSVGFill = "var(--color-contrast-high)"
    # 如果否，则会使用你的站点标题作为默认值，并
    # 以文字的形式显示，下方可配置字号和字色。字
    # 体请到底部的字体部分配置。单位：em。
    siteBrandFontSize = 2
    siteBrandFontColor = "var(--color-contrast-high)"
    #siteBrandFontColor = "#fff"


    ######################################
    # 菜单栏

    # 是否开启
    enableMenu = true
    # 说明：对弹性布局的顶栏无效

    # 是否在首页显示
    displayMenuInHome = true
    # 说明：对弹性布局的顶栏无效

    # 是否按文章分区高亮当前菜单项
    activeInSection = true
    # 说明：如果开启，那么当某一文章的分区名是某
    #      一菜单项中的 `url` 时，该文章页面中
    #      的该菜单项也会被高亮


    ######################################
    # 首页布局

    # MemE 主题有以下四种首页布局：
    # 1. poetry    诗意人生
    # 2. footage   视频片段
    # 3. posts     文章摘要
    # 4. page      普通页面

    homeLayout = "poetry"

    ## 「诗意人生」
    # 诗句，支持 Markdown
    homePoetry = ["十里青山遠，潮平路帶沙","數聲啼鳥怨年華","又是淒涼時候，在天涯","白露收殘月，清風散曉霞","綠楊堤畔問荷花","記得年時沽酒，那人家"]
    # 底部链接的内间距，单位：em
    homeLinksPadding = 1

    ## 「视频片段」
    homePoster = ""
    homeVideoWebm = ""
    homeVideoMp4 = ""
    homeLogo = "/icons/android-chrome-512x512.png"
    homeLogoLink = "/home/"
    homeTitle = "荷戟独彷徨"
    homeMotto = "The Sound of Silence"
    homeDescription = "十里青山远，潮平路带沙。数声啼鸟怨年华。又是凄凉时候，在天涯。白露收残月，清风散晓霞。绿杨堤畔问荷花：记得年时沽酒，那人家？"
    homeKeywords = "个人博客，关键词：生活、悦读、品影、旅行、青春、幻想、科学、技术、光学、计算机"
    homeLinksDelimiter = "·"

    ## 「文章摘要」
    enableHideInHomepage = false
    # 说明：激活 `hideInHomepage` front matter
    #      的支持（性能原因默认关闭）


    ######################################
    # 站点信息

    # 站点的 LOGO
    siteLogo = "/icons/apple-touch-icon.png"
    # 说明：用于 JSON-LD、Open Graph

    # 站点的描述
    siteDescription = "Guanqr's Blog"
    # 说明：用于 HTML 的头部元数据、JSON-LD、
    #      Open Graph、Atom、RSS

    # 站点的创建时间
    siteCreatedTime = "2019-03-31T19:35:30+08:00"
    # 注意：请保持此格式，更改数字

    # 站点的推特帐号
    siteTwitter = ""
    # 说明：用于 Twitter Cards


    ######################################
    # 分类方式

    # MemE 主题支持以下两种分类方式：
    # 1. sections       分区
    # 2. categories     部类
    # 其中，分区是基于站点的 content 目录下的
    # 文件夹和子文件夹；部类是基于文章的 Front
    # Matter。分类即树状分类，Hexo 是基于文章
    # 的 Front Matter，Hugo 则是基于文件系统
    # 的结构。由于设计理念的不同，导致了 Hexo
    # 与 Hugo 的这个差异，故在此设计这个选项，
    # 以对从 Hexo 过来的用户友好。但是请注意：
    # Hugo 中无法完全实现基于 Front Matter
    # 的树状分类，故如需保留树状分类，建议适应
    # Hugo 的设计理念——分区。

    categoryBy = "sections"
    # 注意：如果你设置为 `sections`，请务必将
    #      此配置文件中的类别（taxonomies）中
    #      的 `categories` 删除，不然分类页
    #      面会失效。同时，你还需要自己新建一个
    #      `content/categories/_index.md`
    #      文件。


    ######################################
    # 分类页面

    # 是否开启树状布局
    enableTree = true
    # 注意：如果你设置 categoryBy 为
    # `sections`，则无法关闭树状布局

    # 是否显示文章标题
    displayPosts = true

    # 是否显示每一分类下的文章数
    displayPostsCount = true

    # 设置一个非负数来限制每一分类下展示的文章数
    limitPostsLimit = 5


    ######################################
    # 标签页面

    # 是否开启标签云
    enableTagCloud = true
    # 字号单位
    fontUnit = "em"
    # 最大字号
    largestFontSize = 2.5
    # 最小字号
    smallestFontSize = 1


    ######################################
    # 列表页面

    # 宽度
    listWidth = 42
    # 说明：如果留空（""），则用 42 作为默认值
    #      单位：em

    # 是否显示列表标题
    displayListTitle = true

    # 日期的格式
    listDateFormat = "2006-01-02"
    # 注意：请遵循格式 https://gohugo.io/functions/format/

    # 日期的位置
    listDatePosition = "right"
    # 说明：left（左边）或 right（右边）

    # 是否按月份分隔列表
    groupByMonth = false

    # 是否开启十二生肖
    chineseZodiac = true

    # 是否翻译年份（仅对年份标题有效）
    i18nYear = false
    # 是否翻译月份（仅对月份标题有效）
    i18nMonth = false


    ######################################
    # 类别列表页面

    # 说明：对于分类页面，你可以设置 `enableTree`
    #      为 false 以得到一个普通的类别列表页
    #      面；对于标签页面，你可以设置
    #      `enableTagCloud` 为 false 以得到
    #      一个普通的类别列表页面。

    # 是否显示每一类别项下的文章数
    displayTaxonomyTermCount = true

    # 设置一个非负数来限制每一类别项下展示的文章数
    limitEntriesLimit = -1


    ######################################
    # 文章分区范围

    # 说明：分区的名字即站点的 content 目录下
    #      的文件夹的名字。

    mainSections = ["life","tech"]


    ######################################
    # Atom & RSS

    # 是否包括全文内容
    includeContent = true
    # 说明：如果否，则只会包含文章的摘要。关于摘
    #      要，Hugo 能按你设置的字数限制自动截
    #      取，你也可以在文章中通过
    #      `<!--more-->`（没有空格）手动控制，
    #      或者在文章的 Front Matter 中通过
    #      `summary` 手动指定。其中，应用的优
    #      先级顺序：手动指定 > 手动控制 > 自
    #      动截取。还需要注意的是，在 MemE 主
    #      题自定义的 Atom 和 RSS 的模板中，
    #      有一个比手动指定更高的优先级——
    #      Front Matter 中的 `description`。

    # 自定页脚（支持 Template 与 Markdown 语法）
    feedFooter = """> 阅读原文：<{{ .Permalink }}>"""
    
    
    ######################################
    # 深色模式

    # 是否开启
    enableDarkMode = true

    # 默认模式
    defaultTheme = "light"
    # 说明：light（浅色模式）或 dark（深色模式）

    # 是否隐藏模式切换开关
    hideThemeToggle = false
    # 是否在首页隐藏模式切换开关
    hideThemeToggleInHome = false
    # 说明：如果开启了深色模式，即使你隐藏了开关，
    #      你的读者依然可能以深色模式阅读你的博
    #      客，如果该读者的系统设置为深色模式的
    #      话。类似，如果你开启深色模式并将默认
    #      模式修改为它，即使你隐藏开关，你的读
    #      者依然可能以浅色模式模式阅读你的博客。
    #      除非，你开启下方这个选项。

    overrideSystemPreferences = false


    ######################################
    # 网页应用

    # 说明：前往 https://realfavicongenerator.net/
    #      生成相关图标和文件，下载后解压。
    #      然后将这些文件移动到 ~/blog/static/icons/
    #      目录下，再将 favicon.ico、site.webmanifest
    #      移动到 ~/blog/static/ 目录下，
    #      最后将 site.webmanifest 重命名为
    #      manifest.json，并检查和修改相关内容
    #      （图标的路径）。

    # 注意：要检查你的图标
    #      请前往 https://realfavicongenerator.net/favicon-checker。
    #      如果检测到任何问题，检查生成的文件和
    #      ~/blog/themes/meme/static/ 目录下
    #      相关文件的文件名差异。如果有差异，
    #      这意味着某些文件可能已经过时。
    #      如有需要，请提 Issue。

    themeColor = "#fff"
    themeColorDark = "#16171d"
    #safariMaskColor = "#2a6df4"
    #msApplicationTileColor = "#fff"


    ######################################
    # 网页头部元数据、搜索引擎优化（SEO）、社交网络发现

    jsonLD = true
    openGraph = true
    twitterCards = true
    # 注意：如果你设置 twitterCards 为 `true`，
    #      请务必开启 openGraph。否则，网页的
    #      Twitter Cards 信息将会不完整。

    # 是否自动探测图片
    autoDetectImages = true
    # 说明：建议开启，否则，你必须在文章的 Front
    #      Matter 中手动指定 `images`，不然，
    #      你在社交网络或 APP 上分享的链接将无
    #      法显示带大图的摘要视图。


    ######################################
    # Service Worker

    # 说明：仅在生产环境（production）下渲染

    enableServiceWorker = true
    # 说明：需要第三方支持，暂见：
    #      https://io-oi.me/tech/pwa-via-workbox/


    ######################################
    # KaTeX 公式支持（包括化学方程式）

    # 是否开启（全局设置）
    enableKaTeX = false
    # 说明：文章的 Front Matter 中的 `katex`
    #      的优先级高于此处


    ######################################
    # MathJax 公式支持（包括化学方程式）

    # 是否开启（全局设置）
    enableMathJax = false
    # 说明：文章的 Front Matter 中的 `mathjax`
    #      的优先级高于此处

    # 是否禁用 MathJax 的右键菜单
    disableMathJaxMenu = false


    ######################################
    # Mermaid (https://github.com/mermaid-js/mermaid)

    enableMermaid = false
    # 说明：文章的 Front Matter 中的 `mermaid`
    #      的优先级高于此处

    mermaidTheme = 'default'
    mermaidThemeDark = 'dark'


    ######################################
    # 评论

    # 说明：仅在生产环境（production）下渲染

    # 是否开启（全局设置）
    enableComments = true
    # 说明：文章的 Front Matter 中的 `comments`
    #      的优先级高于此处

    # 直接加载评论，不需要手动点击按钮加载
    autoLoadComments = false

    ## Disqus
    enableDisqus = false
    disqusShortname = "guanqr"

    ## Valine
    enableValine = false
    valineAppId = ""
    valineAppKey = ""
    valinePlaceholder = "Just go go"
    valinePath = ""
    valineAvatar = "mm"
    valineMeta = ["nick", "mail", "link"]
    valinePageSize = 10
    valineLang = "zh-cn"
    valineVisitor = false
    valineHighlight = true
    valineAvatarForce = false
    valineRecordIP = false
    valineServerURLs = ""
    valineEmojiCDN = ""
    valineEmojiMaps = {}
    valineEnableQQ = false
    valineRequiredFields = []
    # 说明：https://valine.js.org/

    ## Waline
    enableWaline = true
    walineServerURL = "https://waline.guanqr.com/"
