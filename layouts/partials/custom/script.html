<script src="/js/page-transition.js"></script>
<script>
    // Fix back-to-top: <base href="/"> breaks #top anchor
    (function() {
        var btn = document.getElementById('back-to-top');
        if (!btn) return;
        btn.addEventListener('click', function(e) {
            e.preventDefault();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });
    })();
</script>
<script>
    // Override theme switcher: light ↔ dark only, no system.
    // Icon visibility is handled by CSS ([data-theme] selectors),
    // so JS only needs to toggle the attribute.
    if (localStorage.getItem('theme') === 'system') {
        localStorage.setItem('theme', document.documentElement.getAttribute('data-theme') || 'light');
    }

    document.addEventListener('click', function(e) {
        if (!e.target.closest('#theme-switcher')) return;
        e.preventDefault();
        e.stopImmediatePropagation();

        var cur = document.documentElement.getAttribute('data-theme') || 'light';
        var next = cur === 'dark' ? 'light' : 'dark';

        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);

        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', next === 'dark' ? '{{ .Site.Params.themeColorDark }}' : '{{ .Site.Params.themeColor }}');
    }, true);
</script>
<script>
    // Fix load-comments button: after page transition the old DOMContentLoaded
    // handler is lost. Use event delegation instead.
    document.addEventListener('click', function(e) {
        if (!e.target.closest('#load-comments')) return;
        if (typeof loadComments === 'function') {
            loadComments();
            var btn = document.getElementById('load-comments');
            if (btn) btn.style.display = 'none';
        }
    });
</script>
<script>
    // Add a class to the body if the user agent is Safari
    if (navigator.userAgent.includes('Safari') && !navigator.userAgent.includes('Chrome')) {
        document.body.classList.add('safari-only');
    }
</script>
